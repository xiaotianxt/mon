name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Verify tag matches VERSION
        run: test "v$(cat VERSION)" = "${{ github.ref_name }}"

      - name: Build
        run: make build

      - name: Archive
        run: |
          mkdir -p archive
          cp bin/mon archive/
          cd archive
          tar czf ../mon-${{ github.ref_name }}-darwin-arm64.tar.gz mon

      - uses: actions/upload-artifact@v7
        with:
          name: mon-${{ github.ref_name }}-darwin-arm64
          path: mon-${{ github.ref_name }}-darwin-arm64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mon-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: mon-*.tar.gz
          generate_release_notes: true
