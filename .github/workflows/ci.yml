name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Format and vet
        run: make check

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Verify CLI
        run: bin/mon --help
